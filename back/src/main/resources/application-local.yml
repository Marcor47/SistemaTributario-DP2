spring:
  config:
    import: optional:file:./back/.niubiz-sandbox-local.properties,optional:file:./.niubiz-sandbox-local.properties,optional:file:./back/.asistente-local.properties,optional:file:./.asistente-local.properties,optional:file:./back/asistente-local.properties,optional:file:./asistente-local.properties
  flyway:
    locations: classpath:db/migration,classpath:db/datos-prueba,classpath:db/datos-padron

server:
  servlet:
    session:
      cookie:
        secure: false

tributario:
  etl:
    # Las mismas claves públicas de las semillas: un lote a demanda en local da los mismos seudónimos. Solo para
    # los datos ficticios.
    clave-seudonimo-contribuyente: ${ETL_CLAVE_SEUDONIMO_CONTRIBUYENTE:samnet-demo-contribuyente}
    clave-seudonimo-predio: ${ETL_CLAVE_SEUDONIMO_PREDIO:samnet-demo-predio}
  indicadores:
    morosidad:
      calcular-al-iniciar: true
  # Perfil local: al iniciar calcula la segmentación K-means de la última carga y la publica (aprobada como el usuario
  # de la jefatura), para que el filtro «Segmento» y el mapa la muestren. En producción la aprueba la Gerencia.
  segmentacion:
    publicar-al-iniciar: true
    aprobador-inicial: gerencia
  seguridad:
    cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:8081}
