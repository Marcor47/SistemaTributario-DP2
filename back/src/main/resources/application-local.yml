spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/municipalidad}
    username: ${DB_USER:municipalidad}
    password: ${DB_PASSWORD:municipalidad}
  flyway:
    locations: classpath:db/migration,classpath:db/datos-prueba,classpath:db/local

server:
  address: 127.0.0.1
  servlet:
    session:
      cookie:
        secure: false

tributario:
  local:
    internal-read-key: ${LOCAL_INTERNAL_READ_KEY:lectura-local}
    internal-admin-key: ${LOCAL_INTERNAL_ADMIN_KEY:administracion-local}
