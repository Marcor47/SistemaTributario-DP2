spring:
  config:
    import: optional:file:./back/.niubiz-sandbox-local.properties,optional:file:./.niubiz-sandbox-local.properties,optional:file:./back/.asistente-local.properties,optional:file:./.asistente-local.properties
  flyway:
    locations: classpath:db/migration,classpath:db/datos-prueba,classpath:db/datos-demo

server:
