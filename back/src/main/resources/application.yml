spring:
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 55MB
  application:
    name: tributario-back
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/municipalidad}
    username: ${DB_USER:municipalidad}
    password: ${DB_PASSWORD:municipalidad}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration

server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: strict
        secure: ${SESSION_COOKIE_SECURE:false}

tributario:
  tributos:
    # TIM mensual de los tributos municipales (Código Tributario, art. 33): la fija la ordenanza, como máximo la de
    # SUNAT (0,90 %). Confirmar la ordenanza vigente de San Miguel; la última hallada (408/MDSM, 2020) fijaba 1 %.
    tim-mensual: ${TIM_MENSUAL:0.90}
  constancia:
    # Derecho de trámite de la Constancia de No Adeudo (HU020). Confirmar el monto vigente del TUPA con la Municipalidad.
    derecho-tramite: ${CONSTANCIA_DERECHO_TRAMITE:10.00}
    # HU024 (RF-037): la constancia se firma y emite sola al confirmarse el pago. En false vuelve a emitirla el operador.
    firma-automatica: ${CONSTANCIA_FIRMA_AUTOMATICA:true}
  seguridad:
    cors-origins: ${CORS_ORIGINS:http://localhost:5173}
    administrador-inicial:
      habilitado: ${INITIAL_ADMIN_ENABLED:false}
      usuario: ${INITIAL_ADMIN_USERNAME:}
      nombre: ${INITIAL_ADMIN_FULL_NAME:}
      correo: ${INITIAL_ADMIN_EMAIL:}
      clave: ${INITIAL_ADMIN_PASSWORD:}
  archivos:
    predios: ${PREDIO_FILES_DIR:./storage/predios}
    clave: ${PREDIO_FILES_KEY:}
  etl:
    # Claves HMAC de los seudónimos del modelo analítico (RNF-018). Sin ellas el ETL no se ejecuta. Son secretas:
    # se configuran por variable de entorno y no se cambian una vez cargados datos (cambiarían los seudónimos nuevos).
    clave-seudonimo-contribuyente: ${ETL_CLAVE_SEUDONIMO_CONTRIBUYENTE:}
    clave-seudonimo-predio: ${ETL_CLAVE_SEUDONIMO_PREDIO:}
    # El lote se rechaza si una regla deja fuera más de este porcentaje de registros (R1 a R5).
    max-rechazo-porcentaje: ${ETL_MAX_RECHAZO:10}
    # Puntaje desde el que un registro parecido a otro va a la bandeja de homologación (N2) en vez de ser nuevo.
    umbral-revision: ${ETL_UMBRAL_REVISION:0.65}
    # Ejecución diaria (cron de Spring, hora de Lima), p. ej. "0 0 2 * * *"; "-" la desactiva.
    programacion: ${ETL_PROGRAMACION:-}
  # Segmentación de contribuyentes con K-means (HU030, RF-043). Queda en borrador hasta que la jefatura la apruebe.
  segmentacion:
    k-minimo: 2
    k-maximo: 8
    # Ningún segmento con menos de este número de contribuyentes, ni del porcentaje del total.
    tamano-minimo: 3
    tamano-minimo-porcentaje: 2
    reinicios: 20
    semilla: 20261111
    # Años de cuotas vencidas que miden el comportamiento (% a tiempo y atraso medio).
    ventana-anios: 3
    # Sobre más contribuyentes, la silueta se calcula con una muestra fija de este tamaño.
    muestra-silueta: 5000
    # true: recalcula el borrador después de cada lote del ETL publicado desde el backend.
    tras-etl: ${SEGMENTACION_TRAS_ETL:false}
  asistente:
    llm-url: ${LLM_URL:}
    llm-token: ${LLM_TOKEN:}
  niubiz:
    mode: ${NIUBIZ_MODE:sandbox}
    username: ${NIUBIZ_USERNAME:}
    password: ${NIUBIZ_PASSWORD:}
    merchant-id: ${NIUBIZ_MERCHANT_ID:}
    callback-url: ${NIUBIZ_CALLBACK_URL:}
    timeout-url: ${NIUBIZ_TIMEOUT_URL:}
