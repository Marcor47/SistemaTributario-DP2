spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 55MB
  application:
    name: tributario-back
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/municipalidad}
    username: ${DB_USER:municipalidad}
    password: ${DB_PASSWORD:municipalidad}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    # db/datos-prueba solo tiene datos ficticios para desarrollo; se quita al pasar a un entorno real
    locations: classpath:db/migration,classpath:db/datos-prueba

server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: strict
        secure: ${SESSION_COOKIE_SECURE:false}

tributario:
  archivos:
    predios: ${PREDIO_FILES_DIR:./storage/predios}
    clave: ${PREDIO_FILES_KEY:}
